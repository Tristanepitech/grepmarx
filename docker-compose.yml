version: '3'

services:

  db:
    image: postgres:14.1-alpine
    restart: always
    environment:
      - POSTGRES_USER=grepmarx
      - POSTGRES_PASSWORD=!!!CHANGE_ME!!!
    ports:
      - "5432:5432"
    volumes: 
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always

  grepmarx:
    restart: always
    volumes: 
      - ~/.local/share/grepmarx/projects/:/opt/grepmarx/data/projects/
      - ~/.local/share/grepmarx/rules/:/opt/grepmarx/data/rules/
      - /var/run/docker.sock:/var/run/docker.sock
      # todo add docker socket
    #  - ./ldap-cert:/opt/grepmarx/ldap-cert/
    build: .
    links:
      - redis
      - db
    depends_on:
      - redis
      - db

  nginx:
    restart: always
    image: nginx:alpine
    volumes:
      - ./nginx:/etc/nginx/conf.d
    ports:
      - "5000:5000"
    #ports:
    #  - "443:443"
    links:
      - grepmarx
    depends_on: 
      - grepmarx

  # celery:
  #   build: ./celery_worker
  #   container_name: celery-worker
  #   env_file:
  #     - .env_common
  #   depends_on:
  #     - redis
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock

volumes:
    db-data:
    gpx-data:
